[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-launcher"
version = "0.1.0"
description = "Cross-platform Minecraft Java launcher (Fabric/Forge) with a companion client mod"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "keyring>=25",
  "platformdirs>=4",
  "psutil>=5.9",
  "packaging>=24",
  "cryptography>=42",
  "minecraft-launcher-lib>=7.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "pyinstaller>=6.6", "ruff>=0.5"]

[project.scripts]
lumen = "lumen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["E401", "E701", "E702"]
