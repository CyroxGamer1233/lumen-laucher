name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.8" }
      - run: gradle build
        working-directory: client-mod
      - uses: actions/upload-artifact@v4
        with: { name: lumen-client-jar, path: client-mod/build/libs/*.jar }

  windows:
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: lumen-client-jar, path: client-mod/build/libs }
      - run: python -m pip install -e ".[gui,dev]"
      - run: python -m pytest -q
      - run: python build/build_launcher.py
      - run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $v = "0.2.0"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" build\installer.iss
      - uses: actions/upload-artifact@v4
        with: { name: LumenSetup-windows, path: dist/installer/*.exe }
      - uses: actions/upload-artifact@v4
        with: { name: Lumen-windows-portable, path: dist/Lumen }

  publish:
    needs: windows
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: LumenSetup-windows, path: out }
      - uses: actions/download-artifact@v4
        with: { name: lumen-client-jar, path: out }
      - uses: softprops/action-gh-release@v2
        with: { files: out/* }
