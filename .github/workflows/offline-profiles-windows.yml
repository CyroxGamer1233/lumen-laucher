name: Offline Profiles Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "offline-profiles/**"
      - ".github/workflows/offline-profiles-windows.yml"

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: offline-profiles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
          python -m pytest -q
      - name: Build executable
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name LumenOffline --paths src --collect-all PySide6 gui_entry.py
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "build\installer.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: LumenOffline-windows-installer
          path: offline-profiles/dist/LumenOfflineSetup.exe
