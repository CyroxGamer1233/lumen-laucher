name: Offline Profiles Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "offline-profiles/**"
      - "client-mod/**"
      - ".github/workflows/offline-profiles-windows.yml"

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Fabric client mod
        working-directory: client-mod
        run: gradle build --no-daemon

      - name: Bundle client mod with launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path offline-profiles/client-mod | Out-Null
          Copy-Item client-mod/build/libs/*.jar offline-profiles/client-mod/ -Force

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test launcher
        working-directory: offline-profiles
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
          python -m pytest -q

      - name: Build executable
        working-directory: offline-profiles
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name LumenOffline --paths src --collect-all PySide6 --add-data "client-mod;client-mod" gui_entry.py

      - name: Build Inno Setup installer
        working-directory: offline-profiles
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:Program Files (x86)Inno Setup 6ISCC.exe" "buildinstaller.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: LumenOffline-windows-installer
          path: offline-profiles/dist/LumenOfflineSetup.exe
